<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enes Sermaxhaj — UI/UX &amp; Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111013;
    --ink:#F2EFE9;
    --muted:#8A857C;
    --accent:#C7643C;
    --line:#26242A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px;
    overflow:hidden;
  }
  .wrap{
    max-width:760px;
    width:100%;
    text-align:left;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:12px;
    opacity:0;
    animation:rise .9s cubic-bezier(.2,.7,.2,1) .1s forwards;
  }
  .eyebrow::before{
    content:"";
    width:28px;height:1px;
    background:var(--accent);
    display:inline-block;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-size:clamp(48px,9vw,104px);
    line-height:.98;
    letter-spacing:-.02em;
    margin:24px 0 0;
  }
  h1 .line{overflow:hidden;display:block}
  h1 .line span{
    display:block;
    transform:translateY(110%);
    animation:slideUp 1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  h1 .line:nth-child(1) span{animation-delay:.25s}
  h1 .line:nth-child(2) span{animation-delay:.4s}
  h1 .line:nth-child(2) span{color:var(--muted)}
  .role{
    margin-top:34px;
    font-size:clamp(15px,2.2vw,18px);
    color:var(--ink);
    opacity:0;
    animation:rise .9s cubic-bezier(.2,.7,.2,1) .75s forwards;
  }
  .role b{font-weight:500}
  .meta{
    margin-top:10px;
    font-size:14px;
    color:var(--muted);
    opacity:0;
    animation:rise .9s cubic-bezier(.2,.7,.2,1) .9s forwards;
  }
  .foot{
    position:fixed;
    left:32px;right:32px;bottom:28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.02em;
    opacity:0;
    animation:rise .9s ease 1.1s forwards;
  }
  .foot a{color:var(--muted);text-decoration:none;transition:color .3s}
  .foot a:hover{color:var(--ink)}
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
    margin-right:8px;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes slideUp{to{transform:translateY(0)}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  @media (max-width:560px){
    .foot{position:static;margin-top:56px;flex-direction:column;align-items:flex-start;gap:8px;animation:rise .9s ease 1.1s forwards}
    body{align-items:flex-start;padding-top:12vh;overflow:auto}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    h1 .line span{transform:none}
    .eyebrow,.role,.meta,.foot{opacity:1}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Portfolio — in progress</div>
    <h1>
      <span class="line"><span>Enes</span></span>
      <span class="line"><span>Sermaxhaj</span></span>
    </h1>
    <p class="role"><b>UI/UX &amp; Product Designer.</b> Products, websites, brand, and motion.</p>
    <p class="meta">New site on the way.</p>
  </div>
  <div class="foot">
    <span><span class="dot"></span>Pristina, XK</span>
    <a href="mailto:hello@mesokuran.com">hello@mesokuran.com</a>
  </div>
</body>
</html>
